// V26: hợp đồng của dịch vụ tra cứu. protoc sinh lớp message (LookupRequest, LookupReply) và stub (LookupGrpc).
syntax = "proto3";

package lookup;

option java_package = "netlab.grpc.lookup";
option java_multiple_files = true;

service Lookup {
  rpc Lookup (LookupRequest) returns (LookupReply);  // unary: một request, một response
}

message LookupRequest {
  string key = 1;  // số trường 1: định danh trường khi mã hóa, không được đổi
}

message LookupReply {
  bool found = 1;
  string value = 2;
}
