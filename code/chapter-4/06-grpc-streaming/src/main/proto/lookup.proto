// V27: dịch vụ tra cứu với ba kiểu RPC: unary, server streaming, bidirectional streaming.
syntax = "proto3";

package lookup;

option java_package = "netlab.stream.lookup";
option java_multiple_files = true;

service Lookup {
  rpc Lookup (LookupRequest) returns (LookupReply);                    // unary; không có khóa: mã NOT_FOUND
  rpc Prefix (PrefixRequest) returns (stream Entry);                   // server streaming: trả kết quả dần
  rpc LookupMany (stream LookupRequest) returns (stream LookupReply);  // bidirectional streaming
}

message LookupRequest {
  string key = 1;
}

message LookupReply {
  string key = 1;
  bool found = 2;
  string value = 3;
}

message PrefixRequest {
  string prefix = 1;
}

message Entry {
  string key = 1;
  string value = 2;
}
